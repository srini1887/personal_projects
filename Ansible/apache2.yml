---
- name: Install Apache2
  hosts: all
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install Apache2 package
      apt:
        name: apache2
        state: present
      when: ansible_os_family == "Debian"

    - name: Ensure Apache2 service is running
      service:
        name: apache2
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"

    - name: Install Apache2 package
      yum:
        name: httpd
        state: present
      when: ansible_os_family == "centos"

    - name: Ensure Apache2 service is running
      service:
        name: httpd
        state: started
        enabled: yes
      when: ansible_os_family == "centos"