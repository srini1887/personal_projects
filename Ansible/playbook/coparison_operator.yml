
# Comparison Operators in Ansible
- name: Ansible Comparison Operators Playbook
  hosts: all
  gather_facts: yes
  become: yes

  vars:
    a: 5
    b: 3

  tasks:
    - name: Operation on variables
      ansible.builtin.debug:
        msg:
          - "a is equal to b: {{ a == b }}"
          - "a is not equal to b: {{ a != b }}"
          - "a is greater than b: {{ a > b }}"
          - "a is less than b: {{ a < b }}"
          - "a is greater than or equal to b: {{ a >= b }}"
          - "a is less than or equal to b: {{ a <= b }}"