---
- name: Ansible Timestamp Playbook
  hosts: all
  gather_facts: yes
  become: yes

  tasks:

    - name: Get the current date
      ansible.builtin.debug:
        msg: "The current date of the target machine is {{ ansible_date_time.date }}"

    - name: Get the current time
      ansible.builtin.debug:
        msg: "The current time is {{ ansible_date_time.time }}"

    - name: Get the current timestamp
      ansible.builtin.debug:
        msg: "The current timestamp is {{ ansible_date_time.iso8601 }}"

    - name: Get the Unix timestamp
      ansible.builtin.debug:
        msg: "The Unix timestamp is {{ ansible_date_time.epoch }}"

    - name: Get current timestamp using shell
      ansible.builtin.command: date +%Y-%m-%d_%H-%M-%S
      register: current_timestamp

    - name: Create timestamp file
      ansible.builtin.file:
        path: "/tmp/timestamp_{{ current_timestamp.stdout }}.txt"
        state: touch

    - name: Run the task only during night time (8 PM to 6 AM)
      ansible.builtin.debug:
        msg: "This task runs only during night time"
      when: >
        (ansible_date_time.hour | int >= 20) or
        (ansible_date_time.hour | int < 6)