---
- name: Demo playbook
  hosts: all
  become: yes

  tasks:
    - name: Check free RAM
      ansible.builtin.shell: free -m
      register: free_ram

    - name: Display RAM
      ansible.builtin.debug:
        var: free_ram.stdout

    - name: Check free disk space
      ansible.builtin.shell: df -h
      register: free_disk

    - name: Display disk space
      ansible.builtin.debug:
        var: free_disk.stdout